# Local identity provider for AUTH_MODE=oidc. Demo only.
#
#   docker compose up -d keycloak
#
# Keycloak imports keycloak/realm-export.json on start: realm "keystone",
# client "keystone", the IdP groups Keystone maps to roles, and the demo
# users (password = username). Admin console: http://localhost:8080/admin
# (admin / admin). Never use these credentials outside local development.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
